# https://www.codingwiththomas.com/blog/my-sphinx-best-practice-for-a-multiversion-documentation-in-different-languages
name: Build docs

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        description: 'Skip the deploy-to-gh-pages step'
        required: false
        default: true
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Skip the deploy-to-gh-pages step'
        required: false
        default: true
      debug_enabled:
        type: boolean
        description: 'Run the build with debugging enabled'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      # Enable debugging of manually-triggered workflows if the input option was provided
      - name: Debug
        uses: owenthereal/action-upterm@v1
        if: ${{ inputs.debug_enabled }}

      - name: setup
        run: |
          # ... installation of all tools ...
          sudo apt-get install -y python3-sphinx
          sudo pip3 install sphinx-rtd-theme

      - name: build
        run: |
          # get all tags, and run a python script
          # which you find below to build all documents
          git fetch --tags
          cd docs
          mkdir _build
          python3 build_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './pages'

      - name: Deploy to GitHub Pages
        if: (!inputs.dry_run)
        id: deployment
        uses: actions/deploy-pages@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
