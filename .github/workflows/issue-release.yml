name: Docker image

on:
  workflow_call:
      dry_run:
        type: boolean
        description: 'Do not actually issue the release, just check that it is valid.'
        required: false
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Do not actually issue the release, just check that it is valid.'
        required: false
        default: false

jobs:
  issue-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retrieve clients artifacts
        uses: actions/download-artifact@v4

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag-name: ${{ env.VERSION_CLEAN }}
          files: |
            clients/**
            spec/**
