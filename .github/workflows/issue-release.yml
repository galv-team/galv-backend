name: Issue release

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        description: "The tag to apply to the release"
        required: true
      dry_run:
        type: boolean
        description: 'Do not actually issue the release, just check that it is valid.'
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        description: "The tag to apply to the release"
        required: true
      dry_run:
        type: boolean
        description: 'Do not actually issue the release, just check that it is valid.'
        required: false
        default: false

jobs:
  issue-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retrieve clients artifacts
        uses: actions/download-artifact@v4

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          make_latest: "true"
          files: |
            clients/**
            spec/**
