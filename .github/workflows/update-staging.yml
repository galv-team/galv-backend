# When we want to deploy a stage release, to check migrations and other things, we run this workflow.
# At the very least, it runs on any tag that ends -rc\d+
# It will do the following:
# 1. Destroy any existing stage backend and database.
# 2. Create a fork of the BIL production database
# (3. Rewrite all s3 bucket pointers in the stage database to point to the stage bucket)
# 4. Deploy the stage backend using the :latest image
# 5. Deploy the stage backend using the target image, which will run migrations etc.
name: Stage Release
on:
  workflow_dispatch:
  workflow_call:

permissions:
  packages: read

jobs:
  recreate-fly-stage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: staging-group
    env:
      FRONTEND_URL: "https://galv-stage.fly.dev"
      FLY_APP_NAME: "galv-stage-backend"
      FLY_DB_NAME: "galv-stage-db"
      FLY_PROD_DB_NAME: "galv-db"
      FLY_ORG: "oxrse"
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_DEMO_SECRET_KEY }}
      DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_DEMO_SUPERUSER_PASSWORD }}
      DJANGO_EMAIL_HOST_PASSWORD: ${{ secrets.DJANGO_DEMO_EMAIL_HOST_PASSWORD }}
      DJANGO_USER_ACTIVATION_OVERRIDE_ADDRESSES: ${{ secrets.STAGE_DJANGO_USER_ACTIVATION_OVERRIDE_ADDRESSES }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STAGE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy Existing apps
        run: |
          # Search apps list for existing services
          flyctl apps list --org $FLY_ORG > apps.txt
          cat apps.txt
          # Check if the app exists with grep
          if grep -q $FLY_APP_NAME apps.txt; then
              echo "Destroying app $FLY_APP_NAME"
              flyctl apps destroy $FLY_APP_NAME --yes
          else
              echo "App $FLY_APP_NAME does not exist - skipping destroy step"
          fi
          # Check if the database exists
          if grep -q $FLY_DB_NAME apps.txt; then
              echo "Destroying app $FLY_DB_NAME"
              flyctl apps destroy $FLY_DB_NAME --yes
          else
              echo "App $FLY_DB_NAME does not exist - skipping destroy step"
          fi

      # Until we can reliably link the backend to the DB, we'll create them separately
      - name: Create DB
        run: |
          echo "Creating app $FLY_DB_NAME"
          flyctl postgres create \
            --name $FLY_DB_NAME \
            --fork-from $FLY_PROD_DB_NAME \
            --org $FLY_ORG \
            --region lhr \
            --volume-size 10 \
            --vm-size shared-cpu-2x \
            --initial-cluster-size 1

      - name: Rewrite AWS bucket links
        run: |
          echo "Rewriting AWS bucket links"
          echo "This MAY NOT BE NECESSARY because we automatically use envvars for determining the AWS bucket."

      - name: Create Backend
        run: |
          echo "Creating app $FLY_APP_NAME"
          flyctl apps create \
            --name $FLY_APP_NAME \
            --org $FLY_ORG

      - name: Connect DB to Backend
        run: |
          echo "Connecting $FLY_DB_NAME to $FLY_APP_NAME"
          flyctl postgres attach $FLY_DB_NAME \
            --config ./fly.stage.toml \
            --app $FLY_APP_NAME \
            --yes

      - name: Set Backend secrets
        run: |
          echo "Setting secrets"
          flyctl secrets set \
            --app $FLY_APP_NAME \
            --config ./fly.stage.toml \
            --stage \
            DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            DJANGO_SUPERUSER_PASSWORD="$DJANGO_SUPERUSER_PASSWORD" \
            DJANGO_EMAIL_HOST_PASSWORD="$DJANGO_EMAIL_HOST_PASSWORD" \
            DJANGO_USER_ACTIVATION_OVERRIDE_ADDRESSES="$DJANGO_USER_ACTIVATION_OVERRIDE_ADDRESSES" \
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"

      - name: Deploy Backend with `latest` image
        run: |
          echo "Deploying app $FLY_APP_NAME with latest image"
          flyctl deploy \
            --app $FLY_APP_NAME \
            --config ./fly.stage.toml \
            --image ghcr.io/galv-team/galv-backend:latest \
            --env VIRTUAL_HOST=$FLY_APP_NAME.fly.dev \
            --env FRONTEND_VIRTUAL_HOST=$FRONTEND_URL \
            --remote-only \
            --yes

      - name: Deploy Backend building from source
        run: |
          echo "Deploying app $FLY_APP_NAME with build"
          echo "This will run migrations etc."

          flyctl deploy \
            --app $FLY_APP_NAME \
            --config ./fly.stage.toml \
            --env VIRTUAL_HOST=$FLY_APP_NAME.fly.dev \
            --env FRONTEND_VIRTUAL_HOST=$FRONTEND_URL \
            --remote-only \
            --yes
